name: Install Smoke Test

# Builds the ISO and actually installs from it in QEMU, then verifies the
# resulting system. The release workflow only proves the ISO *builds*; every
# installation defect so far shipped through a green build, so this is the job
# that has to be green before cutting a release.

on:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'install/**'
      - 'bin/**'
      - 'default/**'
      - 'launcher/**'
      - 'migrations/**'
      - '.github/workflows/install-smoke-test.yml'
  pull_request:
    paths:
      - 'iso/**'
      - 'install/**'
      - 'bin/**'
      - 'default/**'
      - 'launcher/**'
      - 'migrations/**'
      - '.github/workflows/install-smoke-test.yml'
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Also boot the installed system and capture desktop screenshots
        type: boolean
        default: false
      keep_image:
        description: 'Upload the installed disk image as an artifact'
        type: boolean
        default: false

# A full install takes tens of minutes. Without this, a run of pushes queues a
# run each and they all grind through the same work; only the newest matters.
concurrency:
  group: install-smoke-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Fast tests (boot menu, installer rules)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed kbd xkeyboard-config tzdata shellcheck diffutils python

      - name: Run the fast tests
        run: bash iso/tests/unit.sh

  install-test:
    name: Install in QEMU and verify (${{ matrix.variant }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, encrypted]
    env:
      ENCRYPT: ${{ matrix.variant == 'encrypted' && 'y' || 'n' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cheap, and it guards the one stage that can invalidate everything below
      # it: repository.sh used to reset the installed tree to main, so the rest
      # of this job verified main instead of the branch under test.
      - name: Verify the repository stage preserves the branch under test
        run: bash iso/tests/verify-repository-stage.sh

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install QEMU and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf dosfstools mtools imagemagick cryptsetup-bin btrfs-progs

      - name: Check for KVM acceleration
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available - install runs at near-native speed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KVM; falling back to TCG emulation, which is much slower."
          fi

      - name: Locate OVMF firmware
        id: ovmf
        run: |
          # Package layout differs between Ubuntu releases.
          for c in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            [ -f "$c" ] && { echo "code=$c" >> "$GITHUB_OUTPUT"; break; }
          done
          for v in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do
            [ -f "$v" ] && { cp "$v" ./OVMF_VARS.fd; break; }
          done
          ls -l ./OVMF_VARS.fd
          cat "$GITHUB_OUTPUT"

      - name: Build ISO
        run: |
          # The commit is passed in rather than read from .git: the repository is
          # bind-mounted into the container under another uid, so git inside it
          # refuses the directory as dubious ownership. Without this the image
          # records nothing, repository.sh assumes main, and this job verifies
          # main instead of the branch under test.
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e "COSMARCHY_BUILD_COMMIT=${{ github.sha }}" \
            archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm archlinux-keyring &&
              pacman -S --noconfirm --needed archiso git rsync base-devel &&
              chmod +x iso/builder/build-iso.sh &&
              ./iso/builder/build-iso.sh /workspace/out
            "
          sudo chown -R "$USER:$USER" out
          ls -lh out/

      - name: Create unattended answers disk
        run: |
          # The answers travel on a separate labeled disk so the ISO under test
          # stays byte for byte identical to the ISO that ships.
          mkdir -p answers
          {
            echo 'COSMARCHY_DISK=/dev/vda'
            echo 'COSMARCHY_FULLNAME="CI Test User"'
            echo 'COSMARCHY_USERNAME=citest'
            echo 'COSMARCHY_PASSWORD=ci-test-password-123'
            echo "COSMARCHY_ENCRYPT=$ENCRYPT"
            # Each differs from its default, so a field the installer ignores
            # fails a check instead of passing by coincidence.
            echo 'COSMARCHY_HOSTNAME=citest-host'
            echo 'COSMARCHY_TIMEZONE=Europe/Berlin'
            echo 'COSMARCHY_KEYMAP=de'
          } > answers/cosmarchy-unattended.conf
          cat answers/cosmarchy-unattended.conf

          truncate -s 8M answers.img
          mkfs.vfat -n COSMARCHY answers.img
          mcopy -i answers.img answers/cosmarchy-unattended.conf ::/
          mdir -i answers.img ::/

      - name: Run the installer in QEMU
        run: |
          qemu-img create -f qcow2 disk.qcow2 30G

          ACCEL="-accel tcg"
          MEM=4096
          if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
            ACCEL="-accel kvm -cpu host"
            MEM=8192
          fi

          set +e
          sudo timeout 100m qemu-system-x86_64 \
            $ACCEL -smp 4 -m $MEM \
            -drive if=pflash,format=raw,readonly=on,file=${{ steps.ovmf.outputs.code }} \
            -drive if=pflash,format=raw,file=./OVMF_VARS.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file=answers.img,if=virtio,format=raw \
            -cdrom out/*.iso \
            -boot d \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:installer-serial.log \
            -no-reboot
          echo "qemu exit: $?"
          set -e

          sudo chown "$USER:$USER" disk.qcow2 installer-serial.log 2>/dev/null || true
          echo "--- installer serial tail ---"
          tail -80 installer-serial.log 2>/dev/null || echo "(no serial output captured)"

      - name: Mount the installed system
        id: mount
        run: |
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          sudo partprobe /dev/nbd0 || true
          lsblk /dev/nbd0

          ROOT_DEV=/dev/nbd0p3
          if [ "$ENCRYPT" = y ]; then
            printf '%s' ci-test-password-123 | sudo cryptsetup open --key-file=- /dev/nbd0p3 ci-root
            ROOT_DEV=/dev/mapper/ci-root
          fi
          echo "root_dev=$ROOT_DEV" >> "$GITHUB_OUTPUT"

          sudo mkdir -p /mnt/cosmarchy
          # The installer splits the filesystem into subvolumes. Mounting only
          # @ leaves /home, /var/log and /.snapshots as empty directories,
          # which silently turns every check against them into a false failure.
          if sudo mount -o subvol=@,ro "$ROOT_DEV" /mnt/cosmarchy; then
            sudo mount -o subvol=@home,ro "$ROOT_DEV" /mnt/cosmarchy/home
            sudo mount -o subvol=@var_log,ro "$ROOT_DEV" /mnt/cosmarchy/var/log
            sudo mount -o subvol=@snapshots,ro "$ROOT_DEV" /mnt/cosmarchy/.snapshots
            sudo mount -o ro /dev/nbd0p2 /mnt/cosmarchy/boot
            echo "mounted=true" >> "$GITHUB_OUTPUT"
            echo "--- root ---";       sudo ls /mnt/cosmarchy
            echo "--- home ---";       sudo ls /mnt/cosmarchy/home
            echo "--- var/log ---";    sudo ls /mnt/cosmarchy/var/log
            echo "--- .snapshots ---"; sudo ls /mnt/cosmarchy/.snapshots
          else
            echo "mounted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not mount the installed root - the install never completed."
            exit 1
          fi

      - name: Show where the installer got to
        if: always() && steps.mount.outputs.mounted == 'true'
        run: |
          LOG=/mnt/cosmarchy/var/log/cosmarchy-install.log
          if sudo test -f "$LOG"; then
            echo "Last stage completed:"
            sudo grep 'STAGE OK' "$LOG" | tail -1 || echo "  (none)"
            echo "Stopped in:"
            sudo grep 'STAGE START' "$LOG" | tail -1 || echo "  (none)"
            echo
            echo "--- last 60 lines of the install log ---"
            sudo tail -60 "$LOG"
          else
            echo "::warning::No install log on the target; the chroot stage may never have started."
          fi

          INSTALLER_LOG=/mnt/cosmarchy/var/log/cosmarchy-installer.log
          if sudo test -f "$INSTALLER_LOG"; then
            echo
            echo "--- last 40 lines of the installer log ---"
            sudo tail -40 "$INSTALLER_LOG"
          fi

      - name: Verify installed system (offline)
        env:
          COSMARCHY_TEST_USER: citest
          COSMARCHY_TEST_DISK: /dev/nbd0
          COSMARCHY_TEST_HOSTNAME: citest-host
          COSMARCHY_TEST_TIMEZONE: Europe/Berlin
          COSMARCHY_TEST_KEYMAP: de
          COSMARCHY_TEST_ENCRYPT: ${{ env.ENCRYPT }}
          COSMARCHY_TEST_LUKS_DEV: /dev/nbd0p3
        # `sudo -E` does not carry the environment through on this runner
        # (sudo-rs), which silently turned every COSMARCHY_TEST_* check off.
        # Hand the variables to the script explicitly through env(1).
        run: |
          sudo env \
            CI="$CI" \
            COSMARCHY_TEST_USER="$COSMARCHY_TEST_USER" \
            COSMARCHY_TEST_DISK="$COSMARCHY_TEST_DISK" \
            COSMARCHY_TEST_HOSTNAME="$COSMARCHY_TEST_HOSTNAME" \
            COSMARCHY_TEST_TIMEZONE="$COSMARCHY_TEST_TIMEZONE" \
            COSMARCHY_TEST_KEYMAP="$COSMARCHY_TEST_KEYMAP" \
            COSMARCHY_TEST_ENCRYPT="$COSMARCHY_TEST_ENCRYPT" \
            COSMARCHY_TEST_LUKS_DEV="$COSMARCHY_TEST_LUKS_DEV" \
            bash iso/tests/verify-install.sh /mnt/cosmarchy

      - name: Prepare the image for the session test
        if: always() && steps.mount.outputs.mounted == 'true' && matrix.variant == 'plain'
        run: |
          sudo umount -R /mnt/cosmarchy
          sudo mount -o subvol=@ ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy
          sudo mount -o subvol=@home ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy/home
          # /boot is the EFI partition, not part of the @ subvolume; limine.conf
          # lives there and is invisible without this.
          sudo mount /dev/nbd0p2 /mnt/cosmarchy/boot

          # Autologin via greetd [initial_session] so a real COSMIC session
          # starts without interactive login. The unattended installer already
          # wrote ~/.config/cosmic-initial-setup-done.
          GREETER_CONF=/mnt/cosmarchy/etc/greetd/cosmic-greeter.toml
          if ! sudo grep -q '^\[initial_session\]' "$GREETER_CONF"; then
            printf '\n[initial_session]\ncommand = "start-cosmic"\nuser = "citest"\n' \
              | sudo tee -a "$GREETER_CONF" > /dev/null
          fi

          sudo install -m 755 iso/tests/verify-session.sh \
            /mnt/cosmarchy/usr/local/bin/cosmarchy-verify-session

          # Ordered last by filename so it runs once the session autostart fires.
          sudo mkdir -p /mnt/cosmarchy/home/citest/.config/autostart
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Cosmarchy CI Session Verification' \
            'Exec=/usr/local/bin/cosmarchy-verify-session' \
            'Terminal=false' \
            'X-GNOME-Autostart-enabled=true' \
            'NoDisplay=true' \
            | sudo tee /mnt/cosmarchy/home/citest/.config/autostart/zz-verify.desktop > /dev/null
          sudo chown -R 1000:1000 /mnt/cosmarchy/home/citest/.config

          # Let the verification script end the run.
          echo 'citest ALL=(ALL) NOPASSWD: /usr/bin/systemctl poweroff, /usr/bin/snapper, /usr/bin/pacman, /usr/local/lib/cosmarchy/boot/cosmarchy-boot' \
            | sudo tee /mnt/cosmarchy/etc/sudoers.d/99-ci-verify > /dev/null
          sudo chmod 440 /mnt/cosmarchy/etc/sudoers.d/99-ci-verify

          # Put the kernel console on the serial port for this test image
          # only. Without it the serial log captures nothing past the EFI
          # menu, and a boot that fails is completely opaque.
          if sudo test -f /mnt/cosmarchy/boot/limine.conf; then
            sudo sed -i 's/quiet splash/console=tty0 console=ttyS0,115200 systemd.log_level=info/' \
              /mnt/cosmarchy/boot/limine.conf /mnt/cosmarchy/etc/kernel/cmdline
            echo "--- limine.conf ---"
            sudo cat /mnt/cosmarchy/boot/limine.conf
          else
            # A warning here only becomes an annotation, which is easy to miss;
            # without the serial console the session test cannot be diagnosed
            # at all, so fail rather than run blind.
            echo "::error::No limine.conf at /mnt/cosmarchy/boot - is the EFI partition mounted?"
            sudo ls -la /mnt/cosmarchy/boot || true
            exit 1
          fi

          # Persist the journal so a failed boot can be read offline.
          sudo mkdir -p /mnt/cosmarchy/var/log/journal

          sudo umount -R /mnt/cosmarchy
          sudo qemu-nbd --disconnect /dev/nbd0
          sleep 3

      - name: Boot the installed system and verify the session
        if: always() && steps.mount.outputs.mounted == 'true' && matrix.variant == 'plain'
        run: |
          ACCEL="-accel tcg"
          MEM=4096
          if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
            ACCEL="-accel kvm -cpu host"
            MEM=8192
          fi

          set +e
          sudo timeout 15m qemu-system-x86_64 \
            $ACCEL -smp 4 -m $MEM \
            -drive if=pflash,format=raw,readonly=on,file=${{ steps.ovmf.outputs.code }} \
            -drive if=pflash,format=raw,file=./OVMF_VARS.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:session-serial.log \
            -no-reboot
          echo "qemu exit: $?"
          set -e
          sudo chown "$USER:$USER" disk.qcow2 session-serial.log 2>/dev/null || true

      - name: Read session verification results
        id: session
        if: always() && steps.mount.outputs.mounted == 'true' && matrix.variant == 'plain'
        run: |
          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          sudo mount -o subvol=@,ro ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy
          sudo mount -o subvol=@home,ro ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy/home
          sudo mount -o subvol=@var_log,ro ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy/var/log

          # The verify script logged nothing at all last time, so establish
          # whether it was ever installed and scheduled before interpreting
          # anything else.
          echo "--- autostart entries ---"
          sudo ls -la /mnt/cosmarchy/home/citest/.config/autostart/ 2>&1 || echo "(no autostart dir)"
          echo "--- verify script on the image ---"
          sudo ls -la /mnt/cosmarchy/usr/local/bin/cosmarchy-verify-session 2>&1 || echo "(not installed)"
          echo "--- first-run stamp ---"
          sudo ls -la /mnt/cosmarchy/home/citest/.local/state/cosmarchy/ 2>&1 || echo "(no state dir)"
          echo "--- COSMIC session and autostart decisions ---"
          if sudo test -d /mnt/cosmarchy/var/log/journal; then
            sudo journalctl -D /mnt/cosmarchy/var/log/journal --no-pager 2>/dev/null |
              grep -iE "zz-verify|cosmarchy-verify|cosmic-session|cosmic-comp|cosmic-settings-daemon|autostart" | tail -25 ||
              echo "(nothing about COSMIC/autostart in the journal)"
          fi

          echo "--- first-run trace ---"
          if sudo test -d /mnt/cosmarchy/var/log/journal; then
            sudo journalctl -D /mnt/cosmarchy/var/log/journal --no-pager               -t cosmarchy-first-run 2>/dev/null || echo "(no trace recorded)"
          fi

          echo "--- verification trace ---"
          if sudo test -d /mnt/cosmarchy/var/log/journal; then
            sudo journalctl -D /mnt/cosmarchy/var/log/journal --no-pager               -t cosmarchy-verify 2>/dev/null || echo "(no trace recorded)"
          fi

          echo "--- journal from the boot attempt ---"
          if sudo test -d /mnt/cosmarchy/var/log/journal; then
            sudo journalctl -D /mnt/cosmarchy/var/log/journal --no-pager \
              -p warning 2>/dev/null | tail -40 || echo "(journal unreadable)"
          else
            echo "(no persistent journal)"
          fi

          REPORT=/mnt/cosmarchy/home/citest/.local/state/cosmarchy/verify/session.txt
          RESULT_OK=0
          if sudo test -f "$REPORT"; then
            echo "=== session verification report ==="
            sudo cat "$REPORT"
            # Hand the snapshot on even when a check failed, so a flaky session
            # check does not hide the snapshot boot.
            SNAP="$(sudo sed -n 's/^SNAPSHOT: //p' "$REPORT")"
            echo "snapshot=$SNAP" >> "$GITHUB_OUTPUT"
            if sudo grep -q "RESULT: SUCCESS" "$REPORT"; then
              echo "Session verification passed."
              RESULT_OK=1
            else
              echo "::error::Session verification failed."
            fi
          else
            echo "::error::No session report - the desktop never reached the verification step."
            echo "--- session serial tail ---"
            tail -100 session-serial.log 2>/dev/null || true
          fi

          sudo umount -R /mnt/cosmarchy
          sudo qemu-nbd --disconnect /dev/nbd0
          sleep 3
          [ "$RESULT_OK" -eq 1 ] || exit 1

      - name: Boot the snapshot and restore it
        if: always() && steps.session.outputs.snapshot != '' && matrix.variant == 'plain'
        run: |
          ACCEL="-accel tcg"
          MEM=4096
          if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
            ACCEL="-accel kvm -cpu host"
            MEM=8192
          fi
          set +e
          sudo timeout 15m qemu-system-x86_64 \
            $ACCEL -smp 4 -m $MEM \
            -drive if=pflash,format=raw,readonly=on,file=${{ steps.ovmf.outputs.code }} \
            -drive if=pflash,format=raw,file=./OVMF_VARS.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:snapshot-serial.log \
            -no-reboot
          echo "qemu exit: $?"
          set -e
          sudo chown "$USER:$USER" disk.qcow2 snapshot-serial.log 2>/dev/null || true

      - name: Read snapshot-boot results and check the restore
        if: always() && steps.session.outputs.snapshot != '' && matrix.variant == 'plain'
        env:
          SNAP: ${{ steps.session.outputs.snapshot }}
        run: |
          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          ROOT_DEV=${{ steps.mount.outputs.root_dev }}
          sudo mount -o subvol=@home,ro "$ROOT_DEV" /mnt/cosmarchy
          REPORT=/mnt/cosmarchy/citest/.local/state/cosmarchy/verify/snapshot.txt
          if ! sudo test -f "$REPORT"; then
            echo "::error::No snapshot-boot report - snapshot $SNAP never reached a session."
            tail -150 snapshot-serial.log || true
            exit 1
          fi
          echo "=== snapshot-boot report ==="
          sudo cat "$REPORT"
          # Take the verdict now: $REPORT lives on the mount released below.
          report_ok=0
          if sudo grep -q "RESULT: SUCCESS" "$REPORT"; then report_ok=1; fi
          sudo umount /mnt/cosmarchy

          sudo mkdir -p /mnt/cosmarchy-top
          sudo mount -o subvolid=5,ro "$ROOT_DEV" /mnt/cosmarchy-top
          failed=0
          if compgen -G "/mnt/cosmarchy-top/@restore-backup-*" > /dev/null; then
            echo "PASS  the previous root is kept as $(cd /mnt/cosmarchy-top && ls -d @restore-backup-*)"
          else
            echo "FAIL  no @restore-backup-* after the restore"; failed=1
          fi
          parent="$(sudo btrfs subvolume show /mnt/cosmarchy-top/@ | awk '/Parent UUID:/ { print $3 }')"
          uuid="$(sudo btrfs subvolume show "/mnt/cosmarchy-top/@snapshots/$SNAP/snapshot" | awk '$1 == "UUID:" { print $2 }')"
          if [ -n "$uuid" ] && [ "$parent" = "$uuid" ]; then
            echo "PASS  @ is a copy of snapshot $SNAP"
          else
            echo "FAIL  @'s parent is '$parent', snapshot $SNAP is '$uuid'"; failed=1
          fi
          if sudo test -e "/mnt/cosmarchy-top/@snapshots/$SNAP/snapshot/var/tmp/cosmarchy-overlay-probe"; then
            echo "FAIL  a write during the snapshot boot reached the snapshot"; failed=1
          else
            echo "PASS  writes during the snapshot boot stayed in the overlay"
          fi
          sudo umount /mnt/cosmarchy-top
          if [ "$report_ok" -ne 1 ] || [ "$failed" -ne 0 ]; then
            echo "::error::Snapshot boot or restore failed."
            exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts
          # Always leave something behind, so an early failure still uploads a
          # usable artifact instead of an empty directory.
          {
            echo "run: ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "kvm: ${{ steps.kvm.outputs.available }}"
            echo "root mounted: ${{ steps.mount.outputs.mounted }}"
            echo "---"
            ls -lh out/ 2>/dev/null || echo "(no ISO built)"
          } > artifacts/summary.txt
          cp installer-serial.log artifacts/ 2>/dev/null || true
          cp session-serial.log artifacts/ 2>/dev/null || true
          cp snapshot-serial.log artifacts/ 2>/dev/null || true
          # Read the logs through mounts of their own: by now earlier steps
          # may have unmounted /mnt/cosmarchy. A failure here only means an
          # earlier step never got that far, which that step already reported.
          ROOT_DEV="${{ steps.mount.outputs.root_dev }}"
          if [ -n "$ROOT_DEV" ]; then
            # The session-read step disconnects the image. A disconnected nbd
            # device reads as size 0, and so does a missing one (hence the
            # fallback echo). On the encrypted variant it stays connected. A
            # failed reconnect must not stop the rest of the collection.
            [ "$(cat /sys/block/nbd0/size 2>/dev/null || echo 0)" != 0 ] ||
              { sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2 && sleep 5; } ||
              echo "Could not reconnect disk.qcow2; the logs inside it are not collected."
            sudo mkdir -p /mnt/ci-log /mnt/ci-home
            sudo mount -o subvol=@var_log,ro "$ROOT_DEV" /mnt/ci-log || true
            sudo mount -o subvol=@home,ro "$ROOT_DEV" /mnt/ci-home || true
            sudo cp /mnt/ci-log/cosmarchy-install.log /mnt/ci-log/cosmarchy-installer.log artifacts/ || true
            sudo cp /mnt/ci-home/citest/.local/state/cosmarchy/verify/*.txt artifacts/ || true
            sudo umount /mnt/ci-log /mnt/ci-home || true
          fi
          sudo chown -R "$USER:$USER" artifacts 2>/dev/null || true
          ls -la artifacts/ || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-test-logs-${{ matrix.variant }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload installed image
        if: always() && inputs.keep_image
        uses: actions/upload-artifact@v4
        with:
          name: installed-disk-image-${{ matrix.variant }}
          path: disk.qcow2
          retention-days: 3

      # --- Screenshots -------------------------------------------------
      # Off by default and dispatch-only: these frames are for the README and
      # for posting, not for proving the install works, and they cost a boot of
      # their own. Nothing here runs on push or pull_request.
      - name: Prepare the image for screenshot capture
        if: always() && inputs.capture_screenshots && matrix.variant == 'plain'
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "The install never mounted, so there is nothing to photograph."
            exit 0
          fi

          sudo umount -R /mnt/cosmarchy 2>/dev/null || true
          # The session-read step disconnects the image; a disconnected or
          # missing nbd device reads as size 0 (hence the fallback echo).
          [ "$(cat /sys/block/nbd0/size 2>/dev/null || echo 0)" != 0 ] || { sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2; sleep 5; }
          sudo mount -o subvol=@ ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy
          sudo mount -o subvol=@home ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy/home

          sudo install -m 755 iso/tests/capture-screenshots.sh \
            /mnt/cosmarchy/usr/local/bin/cosmarchy-capture-screenshots

          # Verification has already run, and its autostart entry powers the
          # machine off - which would end the capture session before it starts.
          sudo rm -f /mnt/cosmarchy/home/citest/.config/autostart/zz-verify.desktop
          printf "%s\n" \
            "[Desktop Entry]" \
            "Type=Application" \
            "Name=Cosmarchy Screenshot Capture" \
            "Exec=/usr/local/bin/cosmarchy-capture-screenshots" \
            "Terminal=false" \
            "X-GNOME-Autostart-enabled=true" \
            "NoDisplay=true" \
            | sudo tee /mnt/cosmarchy/home/citest/.config/autostart/zz-capture.desktop > /dev/null

          # The capture records in this file that it has run, so that a second
          # boot powers off instead of shooting again; it must start absent.
          sudo rm -f /mnt/cosmarchy/home/citest/.local/state/cosmarchy/capture-phase
          sudo chown -R 1000:1000 /mnt/cosmarchy/home/citest/.config

          echo "--- autostart entries for the capture boot ---"
          sudo ls -la /mnt/cosmarchy/home/citest/.config/autostart/

          sudo umount -R /mnt/cosmarchy
          sudo qemu-nbd --disconnect /dev/nbd0
          sleep 3

      - name: Capture the desktop
        if: always() && inputs.capture_screenshots && matrix.variant == 'plain'
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
          KVM: ${{ steps.kvm.outputs.available }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "Skipped: nothing installed to photograph."
            exit 0
          fi
          if [ "$KVM" = "true" ]; then
            export ACCEL="-accel kvm -cpu host"
            export MEM=8192
          fi
          bash iso/tests/capture-host.sh disk.qcow2 ${{ steps.ovmf.outputs.code }} ./OVMF_VARS.fd frames phase1

      - name: Convert and collect the frames
        if: always() && inputs.capture_screenshots && matrix.variant == 'plain'
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "Skipped: nothing installed to photograph."
            exit 0
          fi

          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          sudo mkdir -p /mnt/cosmarchy
          sudo mount -o subvol=@,ro ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy
          # The journal is its own subvolume; without this it is an empty
          # directory and every question asked of it answers nothing.
          sudo mount -o subvol=@var_log,ro ${{ steps.mount.outputs.root_dev }} /mnt/cosmarchy/var/log

          mkdir -p screenshots
          sudo cp /mnt/cosmarchy/var/tmp/cosmarchy-capture.txt screenshots/ 2>/dev/null || true
          cp capture-phase1-serial.log screenshots/ 2>/dev/null || true
          sudo chown -R "$USER:$USER" screenshots

          # A session that dies mid-shoot photographs as a login screen, and
          # the transcript does not notice: the script goes on announcing
          # stages into a session that is no longer there. This is the only
          # place that difference is visible.
          echo "=== session and shell trouble during the capture boots ==="
          sudo journalctl -D /mnt/cosmarchy/var/log/journal --no-pager -p warning 2>/dev/null |
            grep -iE "cosmic-comp|cosmic-greeter|cosmic-session|cosmic-panel|segfault|core-dump|oom" | tail -50 ||
            echo "(nothing, or the journal is unreadable)"

          # The transcript says when each arrangement was on screen, which is
          # what pairs a frame with the thing it is a picture of.
          echo "=== capture transcript ==="
          cat screenshots/cosmarchy-capture.txt 2>/dev/null || echo "(no transcript - the capture script never ran)"

          # A framebuffer dump is about 6 MB a frame; the same pixels as PNG are
          # a fraction of that, and PNG is what anyone downloading this wants.
          CONVERT=convert
          command -v magick >/dev/null 2>&1 && CONVERT=magick
          shopt -s nullglob
          for ppm in frames/*.ppm; do
            png="screenshots/$(basename "${ppm%.ppm}").png"
            "$CONVERT" "$ppm" "$png" || echo "could not convert $ppm"
          done
          for index in frames/*-index.txt; do
            cp "$index" screenshots/
          done

          echo
          echo "=== frames ==="
          ls -la screenshots/

          # A run that photographs nothing has to be visibly red, or it reads
          # as a success that merely happened to produce no artifact.
          if ! ls screenshots/*.png >/dev/null 2>&1; then
            echo "--- serial tails ---"
            tail -60 capture-phase1-serial.log 2>/dev/null || true
            echo "::error::No screenshots were captured."
            exit 1
          fi

      - name: Upload screenshots
        if: always() && inputs.capture_screenshots && matrix.variant == 'plain'
        uses: actions/upload-artifact@v4
        with:
          name: cosmarchy-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          sudo umount -R /mnt/cosmarchy 2>/dev/null || true
          sudo umount /mnt/ci-log /mnt/ci-home 2>/dev/null || true  # only mounted if Collect logs got that far
          sudo umount /mnt/cosmarchy-top 2>/dev/null || true  # only mounted if the restore check got that far
          sudo cryptsetup close ci-root 2>/dev/null || true  # only open on the encrypted variant
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
